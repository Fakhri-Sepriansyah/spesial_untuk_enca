<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Encaa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
  }
  .card {
    background: rgba(255,255,255,0.9);
    padding: 40px 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 90%;
    width: 400px;
    z-index: 2;
  }
  h1 {
    color: #d6336c;
    font-size: 26px;
    margin-bottom: 10px;
  }
  p {
    color: #555;
    font-size: 16px;
    margin-bottom: 30px;
  }
  .quote {
    font-style: italic;
    font-size: 14px;
    color: #b0507a;
    background: #fff0f3;
    padding: 12px 16px;
    border-left: 4px solid #d6336c;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: left;
  }
  .quote2 {
    font-style: italic;
    font-size: 14px;
    color: #b0507a;
    margin-top: 15px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    position: relative;
    height: 60px;
  }
  button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
  }
  #yesBtn {
    background: #d6336c;
    color: white;
  }
  #yesBtn:hover {
    background: #b02454;
    transform: scale(1.1);
  }
  #noBtn {
    background: #eee;
    color: #333;
    position: relative;
  }
  #result {
    margin-top: 20px;
    font-size: 20px;
    color: #d6336c;
    font-weight: bold;
    display: none;
  }
  .heart {
    position: absolute;
    top: -10%;
    font-size: 20px;
    animation: fall linear infinite;
    z-index: 1;
    user-select: none;
  }
  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.3;
    }
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Untuk Encaa 💕</h1>
    <p class="quote">"Aku tahu kita udah berteman cukup lama. Dan dari pertemanan itu, aku sadar kalau perasaanku ke kamu udah lebih dari sekadar teman."</p>
    <p>Will you be my girlfriend?</p>
    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Iya</button>
      <button id="noBtn" onmouseover="moveButton()">Tidak</button>
    </div>
    <div id="result"></div>
  </div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const result = document.getElementById('result');
  const buttonsContainer = document.querySelector('.buttons');

  function moveButton() {
    const containerRect = buttonsContainer.getBoundingClientRect();
    const maxX = containerRect.width - noBtn.offsetWidth;
    const maxY = 200;
    const randomX = Math.random() * maxX - maxX / 2;
    const randomY = Math.random() * maxY - maxY / 2;
    noBtn.style.position = 'relative';
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';

    yesBtn.style.transform = 'scale(' + (1 + Math.random() * 0.3) + ')';
  }

  function sayYes() {
    result.style.display = 'block';
    result.innerHTML = 'I Love You Sayang, Sekarang kita resmi pacaran🥰💖' +
      '<div class="quote2">"8 Agustus 2026"</div>';
    document.querySelector('.buttons').style.display = 'none';
    startHearts();
  }

  function startHearts() {
    setInterval(() => {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 300);
  }
</script>

</body>
</html>
